name: ChaosTamagotchi
options:
  deploymentTarget:
    macOS: "14.0"
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: NO
targets:
  ChaosTamagotchi:
    type: application
    platform: macOS
    sources:
      - ChaosTamagotchi
      - path: ../sidecar/chaos_action.py
        buildPhase: resources
    info:
      path: ChaosTamagotchi/Info.plist
      properties:
        CFBundleName: ChaosTamagotchi
        CFBundleDisplayName: Chaos Tamagotchi
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        NSPrincipalClass: NSApplication
        LSMinimumSystemVersion: "14.0"
        NSAppleEventsUsageDescription: Chaos Tamagotchi sends iMessages through the Messages app when armed.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.chaos.ChaosTamagotchi
        GENERATE_INFOPLIST_FILE: NO
        # Not sandboxed on purpose: the app shells out to python3 and osascript.
        ENABLE_APP_SANDBOX: NO
schemes:
  ChaosTamagotchi:
    build:
      targets:
        ChaosTamagotchi: all
    run:
      environmentVariables:
        FEATHERLESS_API_KEY: ""
        # Debug only: uncomment to shorten the 30 min deadline for testing.
        # CHAOS_DEBUG_DEADLINE_SECONDS: "30"
